<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11101f">
  <meta name="description" content="Conheça o Vero Cardápio Digital: uma forma simples de apresentar seus produtos e receber pedidos pelo WhatsApp.">
  <title>Vero Digital | Soluções simples para seu negócio</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      --vero-bg: #11101f;
      --vero-text: #f7f6fc;
      --vero-muted: #c5c3d2;
      --vero-gold: #f5a623;
    }

    /* O fundo da base precisa ser transparente para o canvas aparecer por trás */
    html {
      background-color: var(--vero-bg);
    }

    body {
      position: relative;
      background: transparent !important;
      color: var(--vero-text);
      overflow-x: hidden;
    }

    /* Canvas animado fixado em tela cheia na camada de fundo */
    #vero-animation-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 0;
      pointer-events: none;
    }

    /* Garante que o conteúdo fique acima do canvas animado */
    .topbar, main, .simple-footer {
      position: relative;
      z-index: 1;
    }

    .topbar, .simple-footer {
      border-color: rgba(255, 255, 255, .14) !important;
    }

    .brand strong, .top-login, .simple-footer, .simple-footer a,
    .back-link, .demo-link, .scroll-note { 
      color: var(--vero-muted) !important; 
    }

    .brand small, .eyebrow { color: #ffc35c !important; }
    .welcome-content p, .product-copy > p { color: #d0cede !important; }
    .mark-caption { color: var(--vero-muted) !important; }

    /* Ajustes da área de boas-vindas para Desktop */
    @media (min-width: 761px) {
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden !important;
      }
      body {
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      .topbar { flex: 0 0 68px; }
      main { flex: 1 1 auto; min-height: 0; }
      .simple-footer { flex: 0 0 48px; }

      .screen.welcome {
        height: 100%;
        min-height: 0;
        padding-top: 18px;
        padding-bottom: 18px;
      }
    }

    @media (max-width: 760px) {
      html, body { 
        min-height: 100%; 
        overflow-x: hidden !important; 
        overflow-y: auto !important; 
      }
      .screen { padding-top: 32px; padding-bottom: 32px; }
    }

    /* Arte Abstrata Fluida (Elemento Central à Direita) */
    .welcome-mark.vero-fluid-art {
      position: relative !important;
      display: block !important;
      width: clamp(280px, 32vw, 440px) !important;
      height: clamp(280px, 32vw, 440px) !important;
      background: transparent !important;
      border: 0 !important;
      box-shadow: none !important;
      isolation: isolate;
    }

    .vero-fluid-art::before {
      content: "";
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 30%, rgba(245, 166, 35, .22), transparent 40%),
        radial-gradient(circle at 70% 70%, rgba(105, 91, 205, .22), transparent 45%);
      filter: blur(30px);
      animation: veroArtGlow 8.5s ease-in-out infinite;
    }

    .fluid-orbit,
    .fluid-ribbon,
    .fluid-core,
    .fluid-glint {
      position: absolute;
      pointer-events: none;
    }

    .fluid-orbit {
      inset: 12%;
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 44% 56% 58% 42% / 44% 42% 58% 56%;
      transform: rotate(-25deg);
    }

    .orbit-one { animation: veroOrbitOne 19s ease-in-out infinite; }
    .orbit-two {
      inset: 20% 8% 18% 18%;
      border-color: rgba(245, 166, 35, .3);
      transform: rotate(35deg);
      animation: veroOrbitTwo 23s ease-in-out infinite;
    }

    .fluid-ribbon {
      width: 76%;
      height: 30%;
      left: 12%;
      top: 35%;
      border-radius: 50%;
      filter: blur(1px);
    }

    .ribbon-one {
      background: linear-gradient(110deg,
        rgba(245, 166, 35, 0) 0%,
        rgba(245, 166, 35, .8) 40%,
        rgba(255, 205, 112, .95) 50%,
        rgba(245, 166, 35, 0) 100%);
      box-shadow: 0 0 35px rgba(245, 166, 35, .2);
      animation: veroRibbonOne 7.2s ease-in-out infinite;
    }

    .ribbon-two {
      width: 80%;
      height: 27%;
      left: 9%;
      top: 39%;
      background: linear-gradient(100deg,
        rgba(91, 83, 178, 0) 0%,
        rgba(112, 105, 206, .7) 45%,
        rgba(194, 185, 255, .85) 52%,
        rgba(91, 83, 178, 0) 100%);
      box-shadow: 0 0 40px rgba(112, 105, 206, .18);
      animation: veroRibbonTwo 9.4s ease-in-out infinite;
    }

    .fluid-core {
      width: 32%;
      height: 32%;
      left: 34%;
      top: 34%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%,
        rgba(255, 224, 165, .95) 0%,
        rgba(245, 166, 35, .9) 25%,
        rgba(210, 113, 14, .7) 50%,
        transparent 100%);
      filter: blur(2px);
      animation: veroCorePulse 6.8s ease-in-out infinite;
    }

    .fluid-glint {
      position: absolute;
      border-radius: 50%;
    }

    .glint-one {
      top: 24%;
      left: 65%;
      width: 9px;
      height: 9px;
      background: #ffe0a3;
      box-shadow: 0 0 16px 4px rgba(245, 166, 35, .4);
      animation: veroGlintOne 6.2s ease-in-out infinite;
    }

    .glint-two {
      top: 68%;
      left: 28%;
      width: 6px;
      height: 6px;
      background: #c9c3ff;
      box-shadow: 0 0 14px 4px rgba(140, 130, 230, .4);
      animation: veroGlintTwo 7.7s ease-in-out infinite;
    }

    @keyframes veroArtGlow {
      0% { transform: scale(.9); opacity: .6; }
      50% { transform: scale(1.1); opacity: .95; }
      100% { transform: scale(.9); opacity: .6; }
    }
    @keyframes veroOrbitOne {
      0% { transform: rotate(-25deg); }
      100% { transform: rotate(335deg); }
    }
    @keyframes veroOrbitTwo {
      0% { transform: rotate(35deg); }
      100% { transform: rotate(-325deg); }
    }
    @keyframes veroRibbonOne {
      0%, 100% { transform: translate(-6%, -10%) rotate(-40deg); }
      50% { transform: translate(6%, 6%) rotate(-25deg); }
    }
    @keyframes veroRibbonTwo {
      0%, 100% { transform: translate(6%, 6%) rotate(25deg); }
      50% { transform: translate(-6%, -6%) rotate(42deg); }
    }
    @keyframes veroCorePulse {
      0%, 100% { transform: scale(.8); opacity: .5; }
      50% { transform: scale(1.15); opacity: .95; }
    }
    @keyframes veroGlintOne {
      0%, 100% { transform: translate(0, 0); opacity: .3; }
      50% { transform: translate(14px, -12px); opacity: 1; }
    }
    @keyframes veroGlintTwo {
      0%, 100% { transform: translate(0, 0); opacity: .3; }
      50% { transform: translate(-12px, 10px); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .vero-fluid-art *,
      .vero-fluid-art::before {
        animation: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Elemento Canvas onde corre a animação JavaScript -->
  <canvas id="vero-animation-bg" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Vero Digital - início">
      <img src="IMG_4390.jpg" alt="" onerror="this.onerror=null;this.src='logo.png'">
      <span><strong>VERO</strong><small>DIGITAL</small></span>
    </a>
    <a class="top-login" href="login.html">Área do lojista</a>
  </header>

  <main>
    <section class="screen welcome" id="inicio">
      <div class="welcome-content">
        <span class="eyebrow">TECNOLOGIA SIMPLES PARA NEGÓCIOS REAIS</span>
        <h1>Bem-vindo à<br><span>Vero Digital.</span></h1>
        <p>A gente cria soluções digitais práticas para facilitar a rotina do seu negócio.</p>
        <a class="button" href="produto.html">Conhecer nossas soluções <span aria-hidden="true">→</span></a>
        <span class="scroll-note">Simples, direto e feito para o seu negócio.</span>
      </div>

      <!-- Arte orgânica em CSS no lado direito -->
      <div class="welcome-mark vero-fluid-art" aria-hidden="true">
        <div class="fluid-orbit orbit-one"></div>
        <div class="fluid-orbit orbit-two"></div>
        <div class="fluid-ribbon ribbon-one"></div>
        <div class="fluid-ribbon ribbon-two"></div>
        <div class="fluid-core"></div>
        <div class="fluid-glint glint-one"></div>
        <div class="fluid-glint glint-two"></div>
      </div>
    </section>
  </main>

  <footer class="simple-footer">
    <span>© <span id="yearSpan"></span> Vero Digital</span>
    <a href="https://wa.me/5587999383956" target="_blank" rel="noopener noreferrer">Fale com a gente no WhatsApp</a>
  </footer>

  <!-- Carregamento dos scripts -->
  <script src="script.js"></script>
  <script src="vero-animacao.js"></script>
</body>
</html>
