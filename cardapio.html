<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Cardápio Digital | Pedidos Online</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="cardapio-body">

  <!-- BANNER TOPO DA LOJA -->
  <header class="store-banner" id="banner">
    <span class="store-badge" id="badgeSegment">● Estabelecimento Aberto</span>
    <h1 class="store-title" id="bannerName">Carregando cardápio...</h1>
    <div class="store-meta">
      <span id="bannerDesc">Consulte nossos produtos abaixo</span>
    </div>
    <div class="store-address" id="bannerAddress"></div>
  </header>

  <!-- BARRA DE BUSCA RÁPIDA -->
  <div class="search-wrapper">
    <i data-lucide="search" class="search-icon-fixed" style="width: 18px; height: 18px;"></i>
    <input type="text" id="searchInput" class="search-input-field" placeholder="Buscar por lanche, bebida ou item...">
  </div>

  <!-- SLIDER HORIZONTAL DE CATEGORIAS -->
  <nav class="categories-slider-container">
    <div class="chips-wrapper" id="categoryChips"></div>
  </nav>

  <!-- LISTA DE PRODUTOS -->
  <main class="catalog-container" id="productsList">
    <p style="text-align: center; color: #94a3b8; padding: 3rem 1rem;">Carregando produtos...</p>
  </main>

  <!-- BARRA INFERIOR FIXA DE CHECKOUT -->
  <aside class="fixed-cart-bar">
    <div class="cart-bar-inner">
      <div class="cart-bar-info">
        <span class="cart-bar-count" id="cartCount">0 itens selecionados</span>
        <span class="cart-bar-total" id="cartTotal">R$ 0,00</span>
      </div>
      <button type="button" id="btnOpenModal" class="btn-view-bag" disabled>
        <span>Ver Sacola</span>
        <i data-lucide="shopping-bag" style="width: 18px; height: 18px;"></i>
      </button>
    </div>
  </aside>

  <!-- MODAL DE CHECKOUT / FINALIZAR PEDIDO -->
  <div id="checkoutModal" class="checkout-modal-overlay">
    <div class="checkout-modal-box">
      
      <div class="modal-header">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <i data-lucide="shopping-cart" style="color: #fbbf24; width: 20px; height: 20px;"></i>
          <h2 style="font-size: 1.15rem; font-weight: 800; color: #fff;">Sua Sacola</h2>
        </div>
        <button type="button" id="btnCloseModal" class="btn-close-modal">✕</button>
      </div>

      <!-- LISTA DE ITENS NA SACOLA -->
      <div id="modalItemsList" style="max-height: 220px; overflow-y: auto;"></div>

      <!-- RESUMO FINANCEIRO -->
      <div class="order-summary-box">
        <div style="display: flex; justify-content: space-between; color: #94a3b8;">
          <span>Subtotal:</span>
          <span id="summarySubtotal" style="font-weight: 700; color: #fff;">R$ 0,00</span>
        </div>
        <div style="display: flex; justify-content: space-between; color: #94a3b8;">
          <span>Taxa de Entrega:</span>
          <span id="summaryDelivery" style="font-weight: 700; color: #fff;">R$ 0,00</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-weight: 900; font-size: 1rem; margin-top: 0.25rem; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 0.4rem;">
          <span>Total Geral:</span>
          <span id="summaryTotal" style="color: #34d399;">R$ 0,00</span>
        </div>
      </div>

      <!-- DADOS DE ENTREGA / RETIRADA -->
      <form id="orderForm" style="display: flex; flex-direction: column; gap: 0.85rem;">
        
        <!-- SELEÇÃO: ENTREGA OU RETIRADA -->
        <div class="input-block">
          <label>Como deseja receber o pedido? *</label>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.25rem;">
            <button type="button" id="btnTypeDelivery" style="padding: 0.65rem; border-radius: 8px; border: 1px solid var(--border-active); background: var(--primary-light); color: #fbbf24; font-weight: 800; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.4rem;">
              <i data-lucide="bike" style="width: 16px; height: 16px;"></i>
              <span>Entrega</span>
            </button>
            <button type="button" id="btnTypePickup" style="padding: 0.65rem; border-radius: 8px; border: 1px solid var(--border-color); background: #090e1a; color: var(--text-muted); font-weight: 800; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.4rem;">
              <i data-lucide="store" style="width: 16px; height: 16px;"></i>
              <span>Retirada</span>
            </button>
          </div>
        </div>

        <div class="input-block">
          <label>Seu Nome *</label>
          <input type="text" id="custName" class="input-modern" placeholder="Ex: João da Silva" required>
        </div>

        <div class="input-block">
          <label>Seu WhatsApp com DDD *</label>
          <input type="tel" id="custPhone" class="input-modern" placeholder="87999999999" required>
        </div>

        <!-- BLOCO DE ENDEREÇO E REFERÊNCIA (SOME SE FOR RETIRADA) -->
        <div id="boxAddress" style="display: flex; flex-direction: column; gap: 0.85rem;">
          <div class="input-block">
            <label>Endereço de Entrega Completo *</label>
            <input type="text" id="custAddress" class="input-modern" placeholder="Rua, número e bairro" required>
          </div>

          <div class="input-block">
            <label>Ponto de Referência</label>
            <input type="text" id="custReference" class="input-modern" placeholder="Ex: Próximo à praça, portão branco">
          </div>
        </div>

        <div class="input-block">
          <label>Forma de Pagamento *</label>
          <select id="custPayment" class="input-modern" required>
            <option value="PIX">PIX</option>
            <option value="Cartão de Crédito/Débito">Cartão de Crédito / Débito (Máquina)</option>
            <option value="Dinheiro">Dinheiro</option>
          </select>
        </div>

        <div class="input-block" id="changeBox" style="display: none;">
          <label>Troco para quanto?</label>
          <input type="text" id="custChange" class="input-modern" placeholder="Ex: Troco para R$ 50">
        </div>

        <button type="submit" class="btn-primary-pro" style="background: #10b981; color: #fff; margin-top: 0.5rem;">
          <i data-lucide="send" style="width: 18px; height: 18px;"></i>
          Enviar Pedido no WhatsApp
        </button>
      </form>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/store.js"></script>
  <script src="js/cardapio.js"></script>
</body>
</html>
