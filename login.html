<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Lojista | Vero Soluções Digitais</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="admin-body" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">
  <div class="login-card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-badge" style="display: inline-block; margin-bottom: 0.5rem; font-size: 0.9rem; padding: 0.35rem 1rem;">VERO</div>
      <h1 style="font-size: 1.4rem; color: #ffffff; font-weight: 800; margin-bottom: 0.25rem;">Painel do Comerciante</h1>
      <p style="font-size: 0.85rem; color: #94a3b8;">Gerencie seu cardápio, produtos e pedidos em tempo real</p>
    </div>

    <!-- ABAS ENTRAR / CRIAR CONTA -->
    <div style="display: flex; gap: 0.5rem; background: rgba(0,0,0,0.3); padding: 0.3rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem;">
      <button type="button" id="tabLogin" class="tab-link active" style="flex: 1; text-align: center; border-radius: 6px; padding: 0.6rem;">Entrar</button>
      <button type="button" id="tabRegister" class="tab-link" style="flex: 1; text-align: center; border-radius: 6px; padding: 0.6rem;">Criar Conta</button>
    </div>

    <form id="authForm" style="display: flex; flex-direction: column; gap: 1rem;">
      <div class="input-block">
        <label>Seu E-mail *</label>
        <input type="email" id="authEmail" class="input-modern" placeholder="exemplo@seucomercio.com" required>
      </div>

      <div class="input-block">
        <label>Sua Senha *</label>
        <input type="password" id="authPassword" class="input-modern" placeholder="Mínimo de 6 dígitos" required minlength="6">
      </div>

      <div id="authError" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #f87171; padding: 0.75rem; border-radius: var(--radius-sm); font-size: 0.85rem; text-align: center;"></div>

      <button type="submit" id="btnAuthSubmit" class="btn-primary-pro" style="width: 100%; margin-top: 0.5rem;">
        <i data-lucide="log-in" style="width: 18px; height: 18px;"></i>
        <span id="btnAuthText">Entrar no Painel</span>
      </button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/store.js"></script>
  <script>
    let mode = "login";
    const tabLogin = document.getElementById("tabLogin");
    const tabRegister = document.getElementById("tabRegister");
    const btnAuthText = document.getElementById("btnAuthText");
    const authError = document.getElementById("authError");

    tabLogin.addEventListener("click", () => {
      mode = "login";
      tabLogin.classList.add("active");
      tabRegister.classList.remove("active");
      btnAuthText.innerText = "Entrar no Painel";
      authError.style.display = "none";
    });

    tabRegister.addEventListener("click", () => {
      mode = "register";
      tabRegister.classList.add("active");
      tabLogin.classList.remove("active");
      btnAuthText.innerText = "Criar Minha Conta Grátis";
      authError.style.display = "none";
    });

    // Se já estiver logado, redireciona para o admin
    document.addEventListener("DOMContentLoaded", async () => {
      const user = await getCurrentUser();
      if (user) {
        window.location.href = "admin.html";
      }
      lucide.createIcons();
    });

    document.getElementById("authForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("authEmail").value.trim();
      const password = document.getElementById("authPassword").value;
      const btn = document.getElementById("btnAuthSubmit");

      btn.disabled = true;
      btnAuthText.innerText = mode === "login" ? "Entrando..." : "Cadastrando...";
      authError.style.display = "none";

      try {
        if (mode === "login") {
          await signIn(email, password);
        } else {
          await signUp(email, password);
        }
        window.location.href = "admin.html";
      } catch (err) {
        authError.innerText = err.message || "Erro na autenticação. Verifique os dados.";
        authError.style.display = "block";
      } finally {
        btn.disabled = false;
        btnAuthText.innerText = mode === "login" ? "Entrar no Painel" : "Criar Minha Conta";
      }
    });
  </script>
</body>
</html>
